<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Qué necesitas? | Séptima Pacha Co.</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --agua-primary: #2ECC71; --agua-secondary: #3498DB; --agua-accent: #1ABC9C; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #0a1a2a 0%, #1a2a3a 50%, #0a2a1a 100%);
            color: #fff;
            cursor: none;
            overflow-x: hidden;
        }
        .custom-cursor {
            position: fixed; width: 24px; height: 24px;
            background: radial-gradient(circle, #1ABC9C 0%, #2ECC71 70%, transparent 100%);
            border-radius: 50%; pointer-events: none; z-index: 9999;
            box-shadow: 0 0 20px #2ECC71;
        }
        .floating-bubble {
            position: fixed; width: 100px; height: 100px; border-radius: 50%;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.25);
            animation: float 15s ease-in-out infinite; z-index: 5; pointer-events: none;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }
        .floating-bubble::before {
            content: ''; position: absolute; top: 12px; left: 20px;
            width: 15px; height: 15px; border-radius: 50%;
            background: #fff; filter: blur(2px); opacity: 0.5;
        }
        .enhanced-container {
            position: relative; background: rgba(10, 26, 42, 0.6);
            border-radius: 20px; padding: 2rem; isolation: isolate; overflow: hidden;
        }
        .enhanced-container::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px;
            background: linear-gradient(135deg, #2ECC71, #3498DB, #1ABC9C);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none;
        }
        .enhanced-container .glow-effect {
            position: absolute; inset: -2px; border-radius: inherit;
            background: conic-gradient(from 0deg, transparent 0%, #2ECC71 10%, transparent 20%, transparent 50%, #1ABC9C 60%, transparent 70%);
            filter: blur(20px); opacity: 0.3; z-index: -1; animation: rotateGlow 6s linear infinite;
        }
        @keyframes rotateGlow { to { transform: rotate(360deg); } }
        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 2rem 3rem; position: relative; z-index: 100;
        }
        .logo {
            font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700;
            display: flex; align-items: center; gap: 0.8rem;
            background: linear-gradient(45deg, var(--agua-primary), var(--agua-secondary), var(--agua-accent));
            background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: waterGradient 4s ease-in-out infinite;
        }
        @keyframes waterGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .chakana {
            width: 40px; height: 40px; background: var(--agua-primary);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.6);
        }
        .skip-btn {
            background: transparent; border: 1px solid var(--agua-primary);
            border-radius: 50px; color: var(--agua-primary); padding: 0.6rem 1.5rem;
            font-weight: 600; cursor: pointer; transition: all 0.3s ease; overflow: hidden; position: relative;
        }
        .skip-btn::before {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            border-radius: 50%; background: var(--agua-primary);
            transform: translate(-50%, -50%); transition: width 0.4s ease, height 0.4s ease; z-index: -1;
        }
        .skip-btn:hover { color: #0a1a2a; box-shadow: 0 0 20px rgba(46, 204, 113, 0.5); }
        .skip-btn:hover::before { width: 300px; height: 300px; }
        .container { min-height: 100vh; display: flex; flex-direction: column; }
        .main-content {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            padding: 3rem 2rem; position: relative; z-index: 10;
        }
        .content-wrapper { max-width: 1200px; width: 100%; }
        .title {
            font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700; margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--agua-primary), var(--agua-secondary), var(--agua-accent));
            background-size: 300% 300%; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: waterGradient 4s ease-in-out infinite; text-align: center;
        }
        .subtitle {
            font-size: clamp(1rem, 3vw, 1.3rem); font-weight: 300; opacity: 0.9;
            margin-bottom: 2rem; line-height: 1.6; text-align: center; color: rgba(255, 255, 255, 0.85);
        }
        .info-badge {
            display: inline-block; background: rgba(46, 204, 113, 0.15);
            border: 1px solid var(--agua-primary); border-radius: 50px;
            color: var(--agua-primary); padding: 0.6rem 1.5rem; margin: 0 auto 2rem;
            display: block; width: fit-content; font-weight: 600;
        }
        .features-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem; margin-bottom: 3rem;
        }
        .feature-card {
            text-align: center; transition: all 0.4s ease;
            cursor: pointer; padding: 2rem 1.5rem; position: relative;
        }
        .feature-card:hover { transform: translateY(-10px) scale(1.02); }
        .feature-card.selected { transform: translateY(-10px) scale(1.05); }
        .feature-card.selected::before {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.3), rgba(52, 152, 219, 0.3));
        }
        .feature-icon {
            font-size: 2.5rem; margin-bottom: 1rem; display: block;
            filter: drop-shadow(0 0 10px rgba(46, 204, 113, 0.5));
        }
        .feature-card.selected .feature-icon { animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .feature-name {
            font-size: 0.95rem; font-weight: 500; color: rgba(255, 255, 255, 0.95); line-height: 1.4;
        }
        .feature-card.selected .feature-name { color: var(--agua-primary); font-weight: 600; }
        .footer {
            padding: 2rem 3rem; display: flex; justify-content: space-between; align-items: center;
            position: relative; z-index: 100; background: rgba(10, 26, 42, 0.8);
            backdrop-filter: blur(20px); border-top: 1px solid rgba(46, 204, 113, 0.2);
        }
        .footer-left { display: flex; align-items: center; gap: 2rem; }
        .progress { display: flex; gap: 0.8rem; align-items: center; }
        .progress-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: rgba(46, 204, 113, 0.3); transition: all 0.4s ease;
        }
        .progress-dot.active {
            background: var(--agua-primary); width: 40px; border-radius: 5px;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
        }
        .selected-counter { font-size: 0.95rem; color: rgba(255, 255, 255, 0.85); }
        .selected-counter .count { color: var(--agua-primary); font-weight: 700; font-size: 1.2rem; }
        .footer-right { display: flex; gap: 1rem; }
        .animated-button {
            --radius: 18px; border-radius: var(--radius); cursor: pointer; font-size: 1rem;
            background: transparent; border: 0; position: relative; min-width: 160px; height: 55px;
            font-family: 'Montserrat', sans-serif; font-weight: 600;
        }
        .animated-button .bg { position: absolute; inset: 0; border-radius: inherit; }
        .animated-button .bg::before {
            content: ""; position: absolute; inset: 0; border-radius: calc(var(--radius) * 1.1);
            background: #1F9D55; filter: blur(5px);
            box-shadow: -5px 4px 0 0 rgba(46, 204, 113, 0.4), -10px 8px 0 0 rgba(46, 204, 113, 0.3);
        }
        .animated-button .wrap {
            border-radius: inherit; height: 100%; transform: translate(4px, -4px); padding: 2px;
            background: linear-gradient(to bottom, #52D87E 0%, #2ECC71 100%); transition: all 0.3s ease;
        }
        .animated-button .content {
            display: flex; align-items: center; justify-content: center; height: 100%;
            border-radius: calc(var(--radius) * 0.85);
            background: linear-gradient(to bottom, #2ECC71 0%, #3498DB 100%); color: #fff;
        }
        .animated-button:hover .wrap { transform: translate(6px, -6px); }
        .btn-back .wrap {
            background: transparent;
            border: 1px solid var(--agua-primary);
        }
        .btn-back .content {
            background: rgba(46, 204, 113, 0.1);
            color: var(--agua-primary);
        }
        .toast {
            position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
            background: rgba(10, 26, 42, 0.95); color: var(--agua-primary);
            padding: 1rem 2rem; border-radius: 12px; opacity: 0; pointer-events: none;
            transition: opacity 0.3s; z-index: 10000; border: 1px solid var(--agua-primary);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }
        .toast.show { opacity: 1; }
        .whatsapp-float {
            position: fixed; bottom: 2rem; right: 2rem; width: 60px; height: 60px;
            background: #25D366; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: #fff; text-decoration: none; z-index: 8000;
            transition: all 0.3s ease; animation: whatsappPulse 2s ease-in-out infinite;
            font-size: 2rem; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
        }
        @keyframes whatsappPulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
            50% { box-shadow: 0 4px 25px rgba(37, 211, 102, 0.5); }
        }
        .whatsapp-float:hover { transform: scale(1.1); background: #128C7E; }
        @media (max-width: 768px) {
            .header, .footer { padding: 1.5rem; }
            .features-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
            .footer { flex-direction: column; gap: 1.5rem; }
            .footer-left { flex-direction: column; gap: 1rem; width: 100%; }
            .footer-right { width: 100%; gap: 0.8rem; }
            .animated-button { width: 100%; }
        }
        @media (max-width: 480px) {
            .features-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="floating-bubble" style="top: 15%; left: 8%; font-size: 2rem;">🎯</div>
    <div class="floating-bubble" style="top: 65%; left: 5%; font-size: 2rem;">✨</div>
    <div class="floating-bubble" style="top: 35%; right: 10%; font-size: 2rem;">💡</div>
    <div class="floating-bubble" style="bottom: 20%; right: 8%; font-size: 2rem;">🚀</div>
    <div class="custom-cursor"></div>

    <div class="container">
        <header class="header">
            <div class="logo">
                <div class="chakana"></div>
                <span>Séptima Pacha</span>
            </div>
            <button class="skip-btn" onclick="skipOnboarding()">Omitir</button>
        </header>

        <main class="main-content">
            <div class="content-wrapper">
                <h1 class="title">¿Qué necesitas en tu sitio?</h1>
                <p class="subtitle">Selecciona todas las funcionalidades que necesitas. Puedes agregar más después.</p>
                <div class="info-badge" id="categoryDisplay">📂 Cargando...</div>
                <div class="features-grid" id="featuresGrid"></div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-left">
                <div class="progress">
                    <div class="progress-dot"></div>
                    <div class="progress-dot active"></div>
                    <div class="progress-dot"></div>
                </div>
                <div class="selected-counter">
                    <span class="count" id="selectedCount">0</span> seleccionadas
                </div>
            </div>
            <div class="footer-right">
                <button class="animated-button btn-back" onclick="goBack()">
                    <div class="bg"></div>
                    <div class="wrap"><div class="content">← Atrás</div></div>
                </button>
                <button class="animated-button" onclick="goToNext()">
                    <div class="bg"></div>
                    <div class="wrap"><div class="content">Continuar →</div></div>
                </button>
            </div>
        </footer>
    </div>

    <div class="toast" id="toast"></div>
    <a href="https://wa.me/543872271144" class="whatsapp-float" target="_blank">💬</a>

    <script>
        const cursor = document.querySelector('.custom-cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX - 12, y: e.clientY - 12, duration: 0.1 });
        });

        const features = [
            { id: 'vender-productos', name: 'Vender productos', icon: '🛍️' },
            { id: 'formulario-contacto', name: 'Formulario de contacto', icon: '📝' },
            { id: 'vender-servicios', name: 'Vender servicios', icon: '💼' },
            { id: 'vender-cursos', name: 'Vender cursos en línea', icon: '🎓' },
            { id: 'vender-membresias', name: 'Vender membresías', icon: '🎫' },
            { id: 'reservar-citas', name: 'Reservar citas', icon: '📅' },
            { id: 'eventos-grupales', name: 'Eventos grupales', icon: '🎟️' },
            { id: 'videos-demanda', name: 'Videos a demanda', icon: '🎬' },
            { id: 'negocio-fisico', name: 'Negocio físico', icon: '🏪' },
            { id: 'mostrar-trabajo', name: 'Mostrar trabajo', icon: '🎨' },
            { id: 'blog', name: 'Blog/Publicación', icon: '📰' },
            { id: 'comunidad', name: 'Comunidad', icon: '👥' },
            { id: 'donaciones', name: 'Donaciones', icon: '💝' },
            { id: 'facturas', name: 'Facturas', icon: '🧾' }
        ];

        let selectedFeatures = [];

        function loadFeatures() {
            const grid = document.getElementById('featuresGrid');
            grid.innerHTML = features.map(feat => `
                <div class="feature-card enhanced-container" data-feature="${feat.id}" onclick="toggleFeature('${feat.id}')">
                    <div class="glow-effect"></div>
                    <span class="feature-icon">${feat.icon}</span>
                    <div class="feature-name">${feat.name}</div>
                </div>
            `).join('');

            gsap.utils.toArray('.feature-card').forEach((card, i) => {
                gsap.fromTo(card, { y: 50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, delay: i * 0.05, ease: "power2.out" });
            });
        }

        function toggleFeature(featureId) {
            const index = selectedFeatures.indexOf(featureId);
            if (index === -1) selectedFeatures.push(featureId);
            else selectedFeatures.splice(index, 1);
            updateUI();
            saveSelections();
        }

        function updateUI() {
            document.querySelectorAll('.feature-card').forEach(card => {
                const featureId = card.getAttribute('data-feature');
                if (selectedFeatures.includes(featureId)) {
                    card.classList.add('selected');
                    gsap.to(card, { scale: 1.05, duration: 0.3, ease: "back.out(1.7)" });
                } else {
                    card.classList.remove('selected');
                    gsap.to(card, { scale: 1, duration: 0.3 });
                }
            });
            document.getElementById('selectedCount').textContent = selectedFeatures.length;
        }

        function saveSelections() {
            localStorage.setItem('selectedFeatures', JSON.stringify(selectedFeatures));
        }

        function goToNext() {
            if (selectedFeatures.length === 0) {
                showToast('Selecciona al menos una funcionalidad');
                return;
            }
            const featureNames = selectedFeatures.map(id => {
                const feature = features.find(f => f.id === id);
                return feature ? feature.name : '';
            });
            localStorage.setItem('selectedFeatureNames', JSON.stringify(featureNames));
            window.location.href = 'webconstructor-pro.html';
        }

        function goBack() { window.location.href = 'onboarding-step1.html'; }

        function skipOnboarding() {
            if (confirm('¿Omitir el asesoramiento personalizado?')) {
                window.location.href = 'webconstructor-pro.html';
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function loadSavedData() {
            const categoryName = localStorage.getItem('siteCategoryName');
            if (categoryName) document.getElementById('categoryDisplay').textContent = `📂 ${categoryName}`;
            const saved = localStorage.getItem('selectedFeatures');
            if (saved) {
                selectedFeatures = JSON.parse(saved);
                updateUI();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadFeatures();
            loadSavedData();
        });
    </script>
</body>
</html>
