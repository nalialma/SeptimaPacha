<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raíz | Séptima Pacha Co.</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --tierra: #8B4513;
            --fuego: #FF6B35;
            --aire: #4A90E2;
            --agua: #2ECC71;
            --oro: #F39C12;
            --sombra: #2C3E50;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            cursor: none;
        }

        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            background: var(--tierra);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.2s ease;
            mix-blend-mode: difference;
        }

        .language-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 9999;
            background: rgba(139, 69, 19, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid var(--tierra);
            border-radius: 50px;
            padding: 0.7rem 1.2rem;
            color: var(--oro);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .language-toggle:hover {
            background: rgba(139, 69, 19, 0.4);
            transform: scale(1.05);
        }

        .back-button {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 9999;
            background: rgba(139, 69, 19, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid var(--tierra);
            border-radius: 50px;
            padding: 0.7rem 1.2rem;
            color: var(--oro);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-button:hover {
            background: rgba(139, 69, 19, 0.4);
            transform: scale(1.05);
        }

        /* HEADER */
        .header {
            height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            background: radial-gradient(ellipse at center, rgba(139, 69, 19, 0.2) 0%, transparent 70%);
            overflow: hidden;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--tierra), var(--oro), var(--tierra));
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: earthGradient 4s ease-in-out infinite;
            position: relative;
        }

        @keyframes earthGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .page-subtitle {
            font-size: clamp(1rem, 3vw, 1.8rem);
            font-weight: 300;
            text-align: center;
            margin-bottom: 2rem;
            opacity: 0.8;
            max-width: 90%;
        }

        .phase-icon {
            font-size: clamp(3rem, 8vw, 5rem);
            margin-bottom: 2rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* CARRUSEL CONTAINER */
        .carousel-section {
            min-height: 100vh;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, rgba(139, 69, 19, 0.05) 0%, transparent 100%);
        }

        .carousel-intro {
            text-align: center;
            max-width: 800px;
            margin-bottom: 4rem;
        }

        .carousel-intro h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--oro);
            margin-bottom: 1rem;
        }

        .carousel-intro p {
            font-size: clamp(1rem, 2.5vw, 1.2rem);
            line-height: 1.6;
            opacity: 0.9;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            height: 600px;
            margin: 0 auto;
        }

        .carousel-track {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }

        .carousel-item {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: center;
            cursor: pointer;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .carousel-item.active {
            opacity: 1;
            z-index: 10;
        }

        /* Animación alternada de entrada */
        .carousel-item.entering-left {
            animation: slideInFromLeft 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .carousel-item.entering-right {
            animation: slideInFromRight 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .carousel-item.leaving-left {
            animation: slideOutToLeft 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .carousel-item.leaving-right {
            animation: slideOutToRight 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes slideInFromLeft {
            from {
                opacity: 0;
                transform: translateX(-100%) rotateY(-20deg) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotateY(0deg) scale(1);
            }
        }

        @keyframes slideInFromRight {
            from {
                opacity: 0;
                transform: translateX(100%) rotateY(20deg) scale(0.8);
            }
            to {
                opacity: 1;
                transform: translateX(0) rotateY(0deg) scale(1);
            }
        }

        @keyframes slideOutToLeft {
            from {
                opacity: 1;
                transform: translateX(0) rotateY(0deg) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(-100%) rotateY(-20deg) scale(0.8);
            }
        }

        @keyframes slideOutToRight {
            from {
                opacity: 1;
                transform: translateX(0) rotateY(0deg) scale(1);
            }
            to {
                opacity: 0;
                transform: translateX(100%) rotateY(20deg) scale(0.8);
            }
        }

        .carousel-image-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--tierra) 0%, var(--oro) 100%);
        }

        .carousel-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .carousel-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.5), transparent);
            padding: 3rem 2rem 2rem;
            color: #fff;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .carousel-item.active .carousel-info {
            transform: translateY(0);
        }

        .carousel-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 4vw, 2.2rem);
            color: var(--oro);
            margin-bottom: 0.8rem;
            font-weight: 700;
        }

        .carousel-description {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            line-height: 1.6;
            opacity: 0.95;
            margin-bottom: 1.2rem;
        }

        .carousel-instagram-link {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, var(--fuego), var(--tierra));
            color: white;
            padding: 0.8rem 1.6rem;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .carousel-instagram-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(243, 156, 18, 0.4);
            background: linear-gradient(135deg, var(--tierra), var(--fuego));
        }

        /* CONTROLES */
        .carousel-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            margin-top: 3rem;
            flex-wrap: wrap;
        }

        .carousel-button {
            background: rgba(139, 69, 19, 0.3);
            border: 2px solid var(--oro);
            color: var(--oro);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .carousel-button:hover {
            background: var(--oro);
            color: #1a1a1a;
            transform: scale(1.1);
        }

        .carousel-button:active {
            transform: scale(0.95);
        }

        .carousel-counter {
            color: var(--oro);
            font-weight: 600;
            font-size: 1.1rem;
            min-width: 100px;
            text-align: center;
        }

        .carousel-dots {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .carousel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(243, 156, 18, 0.3);
            border: 2px solid var(--oro);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .carousel-dot.active {
            background: var(--oro);
            transform: scale(1.3);
        }

        .carousel-dot:hover {
            background: var(--oro);
            transform: scale(1.1);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .carousel-container {
                height: 400px;
            }

            .carousel-info {
                padding: 2rem 1.5rem 1.5rem;
            }

            .carousel-controls {
                gap: 1rem;
                margin-top: 2rem;
            }

            .carousel-button {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }

            .carousel-counter {
                font-size: 1rem;
            }
        }

        @media (max-width: 480px) {
            .carousel-section {
                padding: 2rem 1rem;
            }

            .carousel-container {
                height: 300px;
            }

            .carousel-info {
                padding: 1.5rem 1rem 1rem;
            }

            .carousel-title {
                font-size: 1.3rem;
                margin-bottom: 0.6rem;
            }

            .carousel-description {
                font-size: 0.9rem;
                margin-bottom: 0.8rem;
            }

            .carousel-instagram-link {
                padding: 0.6rem 1.2rem;
                font-size: 0.9rem;
            }

            .carousel-controls {
                gap: 0.8rem;
            }

            .carousel-button {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .carousel-dot {
                width: 10px;
                height: 10px;
            }

            .page-title {
                font-size: 2.5rem;
            }

            .back-button,
            .language-toggle {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }

        .fade-in {
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <!-- Cursor -->
    <div class="custom-cursor">🌱</div>

    <!-- Botón de regreso -->
    <a href="index.html" class="back-button">
        <span>←</span>
        <span data-lang-es="Volver" data-lang-en="Back">Volver</span>
    </a>

    <!-- Botón de idioma -->
    <div class="language-toggle" id="languageToggle">
        <span data-lang-es="English" data-lang-en="Español">English</span>
    </div>

    <!-- Header -->
    <section class="header">
        <div class="phase-icon">🌱</div>
        <h1 class="page-title fade-in" data-lang-es="Raíz" data-lang-en="Root">Raíz</h1>
        <p class="page-subtitle fade-in" data-lang-es="Inspiración ancestral, conexión con la tierra, arte que nace del corazón" data-lang-en="Ancestral inspiration, connection with the earth, art born from the heart">Inspiración ancestral, conexión con la tierra, arte que nace del corazón</p>
    </section>

    <!-- Carrusel -->
    <section class="carousel-section">
        <div class="carousel-intro fade-in">
            <h2 data-lang-es="Semillas de Creación" data-lang-en="Seeds of Creation">Semillas de Creación</h2>
            <p data-lang-es="Cada trazo nace de la tierra. Navega por las obras que danzan entre lo sagrado y lo humano, donde la mano encuentra su voz ancestral." data-lang-en="Each stroke is born from the earth. Navigate through works that dance between the sacred and the human, where the hand finds its ancestral voice.">Cada trazo nace de la tierra. Navega por las obras que danzan entre lo sagrado y lo humano, donde la mano encuentra su voz ancestral.</p>
        </div>

        <div class="carousel-container">
            <div class="carousel-track" id="carouselTrack">
                <!-- Items se generarán con JavaScript -->
            </div>
        </div>

        <div class="carousel-controls">
            <button class="carousel-button" id="prevBtn" onclick="previousSlide()">‹</button>
            <span class="carousel-counter"><span id="currentSlide">1</span> / <span id="totalSlides">12</span></span>
            <button class="carousel-button" id="nextBtn" onclick="nextSlide()">›</button>
        </div>

        <div class="carousel-dots" id="dotsContainer">
            <!-- Dots se generarán con JavaScript -->
        </div>
    </section>

    <script>
        let currentLang = 'es';
        let currentSlide = 0;
        let isAnimating = false;
        let direction = 1;

        // Datos de las obras
        const artworks = [
            {
                title: { es: "Identidad Pacha", en: "Pacha Identity" },
                description: { es: "Rostro de la Pacha a lápiz y bolígrafo, digitalizado. Un retrato que captura la esencia ancestral andina.", en: "Pacha's face in pencil and pen, digitalized. A portrait capturing ancestral Andean essence." },
                instagram: "https://www.instagram.com/p/DF1bPJFOs_P/",
                instaId: "DF1bPJFOs_P"
            },
            {
                title: { es: "Proceso Pacha", en: "Pacha Process" },
                description: { es: "Video del proceso de creación del rostro de Pacha. Observa cómo nace la obra.", en: "Video of the creation process of Pacha's face. Watch how the artwork is born." },
                instagram: "https://www.instagram.com/reel/DFmMvzZusjM/",
                instaId: "DFmMvzZusjM"
            },
            {
                title: { es: "Pretty Ñusta", en: "Pretty Ñusta" },
                description: { es: "Pretty Ñusta: lápiz y bolígrafo digitalizado. Una joven princesa andina reimaginada.", en: "Pretty Ñusta: pencil and pen digitalized. An Andean princess reimagined." },
                instagram: "https://www.instagram.com/p/DFmIpZeu-A-/",
                instaId: "DFmIpZeu-A-"
            },
            {
                title: { es: "Proceso Pretty Ñusta", en: "Pretty Ñusta Process" },
                description: { es: "Video del proceso creativo de Pretty Ñusta desde el boceto hasta la versión final.", en: "Video of Pretty Ñusta's creative process from sketch to final version." },
                instagram: "https://www.instagram.com/reel/DFmGSpIukP1/",
                instaId: "DFmGSpIukP1"
            },
            {
                title: { es: "Yuraj Dog", en: "Yuraj Dog" },
                description: { es: "Retrato de un perrito capturado con sensibilidad y detalle. Honrando la belleza animal.", en: "Portrait of a dog captured with sensitivity and detail. Honoring animal beauty." },
                instagram: "https://www.instagram.com/p/DH9N86PS14l/",
                instaId: "DH9N86PS14l"
            },
            {
                title: { es: "Munay Dog", en: "Munay Dog" },
                description: { es: "Mi perrito rescatado encontrado bajo un puente. Su mirada refleja resiliencia y amor.", en: "My rescued dog found under a bridge. His gaze reflects resilience and love." },
                instagram: "https://www.instagram.com/p/DHwAe8aO3PP/",
                instaId: "DHwAe8aO3PP"
            },
            {
                title: { es: "Ñawi Strange", en: "Ñawi Strange" },
                description: { es: "Ñawi Strange: bolígrafo y lápices de colores, digitalizado. Una obra que explora lo extraño.", en: "Ñawi Strange: pen and colored pencils, digitalized. Exploring the strange." },
                instagram: "https://www.instagram.com/p/DF6HkC-SOxO/",
                instaId: "DF6HkC-SOxO"
            },
            {
                title: { es: "Editado Computadora", en: "Computer Edited" },
                description: { es: "Dibujo a bolígrafo editado en computadora. La fusión entre lo analógico y digital.", en: "Pen drawing edited on computer. Fusion of analog and digital." },
                instagram: "https://www.instagram.com/p/CzcA1V5RD3t/",
                instaId: "CzcA1V5RD3t"
            },
            {
                title: { es: "Compañeros Greenpeace", en: "Greenpeace Companions" },
                description: { es: "Dibujo digital de mis compañeros de Greenpeace. Un homenaje a quienes luchan por el planeta.", en: "Digital drawing of my Greenpeace companions. Tribute to environmental defenders." },
                instagram: "https://www.instagram.com/p/C0bnOMwOIRj/",
                instaId: "C0bnOMwOIRj"
            },
            {
                title: { es: "Johnson - Padre del Blues", en: "Johnson - Father of Blues" },
                description: { es: "Dibujo digital de Johnson, el padre del blues. Un artista legendario que admiro profundamente.", en: "Digital drawing of Johnson, father of blues. A legendary artist I deeply admire." },
                instagram: "https://www.instagram.com/p/CzcEP4uR7rh/",
                instaId: "CzcEP4uR7rh"
            },
            {
                title: { es: "Chanchoman", en: "Chanchoman" },
                description: { es: "Chanchoman: político ecocida de mi ciudad. Una crítica visual a la corrupción ambiental.", en: "Chanchoman: an ecocidal politician. Visual critique of environmental corruption." },
                instagram: "https://www.instagram.com/p/CjCcmkrO6qY/",
                instaId: "CjCcmkrO6qY"
            },
            {
                title: { es: "Illa", en: "Illa" },
                description: { es: "Illa: dibujo a lápiz y bolígrafo, digitalizado. Una obra que refleja la identidad digital.", en: "Illa: pencil and pen drawing, digitalized. Reflecting digital identity." },
                instagram: "https://www.instagram.com/p/DF4WsWkuZMA/",
                instaId: "DF4WsWkuZMA"
            }
        ];

        function getInstagramImageUrl(shortcode) {
            return `https://www.instagram.com/p/${shortcode}/media/?size=l`;
        }

        function initCarousel() {
            const track = document.getElementById('carouselTrack');
            const dotsContainer = document.getElementById('dotsContainer');
            
            artworks.forEach((art, index) => {
                const item = document.createElement('div');
                item.className = 'carousel-item';
                if (index === 0) item.classList.add('active');
                
                const imageUrl = getInstagramImageUrl(art.instaId);
                
                item.innerHTML = `
                    <div class="carousel-image-wrapper">
                        <img src="${imageUrl}" alt="${art.title[currentLang]}" class="carousel-image" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 400%22%3E%3Crect fill=%22%238B4513%22 width=%22400%22 height=%22400%22/%3E%3Ctext x=%22200%22 y=%22200%22 font-size=%2240%22 fill=%22%23fff%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3EObra de Arte%3C/text%3E%3C/svg%3E'">
                    </div>
                    <div class="carousel-info">
                        <h3 class="carousel-title">${art.title[currentLang]}</h3>
                        <p class="carousel-description">${art.description[currentLang]}</p>
                        <a href="${art.instagram}" target="_blank" class="carousel-instagram-link">
                            <span>📸</span>
                            <span data-lang-es="Ver en Instagram" data-lang-en="View on Instagram">${currentLang === 'es' ? 'Ver en Instagram' : 'View on Instagram'}</span>
                        </a>
                    </div>
                `;
                
                track.appendChild(item);

                // Crear dots
                const dot = document.createElement('div');
                dot.className = 'carousel-dot';
                if (index === 0) dot.classList.add('active');
                dot.onclick = () => goToSlide(index);
                dotsContainer.appendChild(dot);
            });

            document.getElementById('totalSlides').textContent = artworks.length;
            updateCarousel();
        }

        function updateCarousel() {
            const items = document.querySelectorAll('.carousel-item');
            const dots = document.querySelectorAll('.carousel-dot');
            
            items.forEach((item, index) => {
                item.classList.remove('active', 'entering-left', 'entering-right', 'leaving-left', 'leaving-right');
                if (index === currentSlide) {
                    item.classList.add('active');
                }
            });

            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });

            document.getElementById('currentSlide').textContent = currentSlide + 1;
        }

        function nextSlide() {
            if (isAnimating) return;
            isAnimating = true;
            direction = 1;
            
            const items = document.querySelectorAll('.carousel-item');
            items[currentSlide].classList.add('leaving-left');
            
            setTimeout(() => {
                currentSlide = (currentSlide + 1) % artworks.length;
                items.forEach(item => item.classList.remove('leaving-left', 'leaving-right', 'entering-left', 'entering-right'));
                items[currentSlide].classList.add('entering-right');
                
                updateCarousel();
                
                setTimeout(() => {
                    isAnimating = false;
                }, 800);
            }, 400);
        }

        function previousSlide() {
            if (isAnimating) return;
            isAnimating = true;
            direction = -1;
            
            const items = document.querySelectorAll('.carousel-item');
            items[currentSlide].classList.add('leaving-right');
            
            setTimeout(() => {
                currentSlide = (currentSlide - 1 + artworks.length) % artworks.length;
                items.forEach(item => item.classList.remove('leaving-left', 'leaving-right', 'entering-left', 'entering-right'));
                items[currentSlide].classList.add('entering-left');
                
                updateCarousel();
                
                setTimeout(() => {
                    isAnimating = false;
                }, 800);
            }, 400);
        }

        function goToSlide(index) {
            if (isAnimating || index === currentSlide) return;
            isAnimating = true;
            
            const items = document.querySelectorAll('.carousel-item');
            const newDirection = index > currentSlide ? 1 : -1;
            
            items[currentSlide].classList.add(newDirection > 0 ? 'leaving-left' : 'leaving-right');
            
            setTimeout(() => {
                currentSlide = index;
                items.forEach(item => item.classList.remove('leaving-left', 'leaving-right', 'entering-left', 'entering-right'));
                items[currentSlide].classList.add(newDirection > 0 ? 'entering-right' : 'entering-left');
                
                updateCarousel();
                
                setTimeout(() => {
                    isAnimating = false;
                }, 800);
            }, 400);
        }

        function toggleLanguage() {
            currentLang = currentLang === 'es' ? 'en' : 'es';
            document.documentElement.lang = currentLang;
            
            const elements = document.querySelectorAll('[data-lang-es], [data-lang-en]');
            elements.forEach(element => {
                const text = element.getAttribute(`data-lang-${currentLang}`);
                if (text) {
                    element.textContent = text;
                }
            });

            const items = document.querySelectorAll('.carousel-item');
            items.forEach((item, index) => {
                const art = artworks[index];
                item.querySelector('.carousel-title').textContent = art.title[currentLang];
                item.querySelector('.carousel-description').textContent = art.description[currentLang];
                const link = item.querySelector('.carousel-instagram-link span:last-child');
                link.textContent = currentLang === 'es' ? 'Ver en Instagram' : 'View on Instagram';
            });
        }

        // Cursor personalizado
        const cursor = document.querySelector('.custom-cursor');
        let trails = [];
        
        for (let i = 0; i < 6; i++) {
            const trail = document.createElement('div');
            trail.style.cssText = `
                position: fixed;
                width: 4px;
                height: 4px;
                background: var(--tierra);
                border-radius: 50%;
                pointer-events: none;
                z-index: 9998;
                opacity: 0.6;
            `;
            document.body.appendChild(trail);
            trails.push(trail);
        }

        let mouseX = 0, mouseY = 0;
        let trailX = [], trailY = [];

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.transform = `translate(${mouseX - 10}px, ${mouseY - 10}px)`;
        });

        function animateTrails() {
            trailX.unshift(mouseX);
            trailY.unshift(mouseY);
            
            if (trailX.length > trails.length) {
                trailX.pop();
                trailY.pop();
            }

            trails.forEach((trail, index) => {
                if (trailX[index] !== undefined) {
                    trail.style.transform = `translate(${trailX[index] - 2}px, ${trailY[index] - 2}px)`;
                }
            });

            requestAnimationFrame(animateTrails);
        }
        animateTrails();

        // Teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') previousSlide();
        });

        document.getElementById('languageToggle').addEventListener('click', toggleLanguage);

        // Inicializar
        window.addEventListener('load', () => {
            initCarousel();
            
            setTimeout(() => {
                document.querySelectorAll('.fade-in').forEach((el, i) => {
                    el.style.cssText = `
                        opacity: 0;
                        transform: translateY(30px);
                        animation: fadeInUp 0.8s ease forwards;
                        animation-delay: ${i * 0.2}s;
                    `;
                });
            }, 100);
        });
    </script>
</body>
</html>
